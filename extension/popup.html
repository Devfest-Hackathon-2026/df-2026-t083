<!doctype html>
<meta charset="utf-8">
<style>
  /* 配信側（public/css/app.css）の暗い側と同じ色を使う。
     同じ製品の一部なので、見た目が揃っていないと別物に見える。 */
  :root { color-scheme: dark;
    --bg:#0a0d13; --surface:#141821; --surface2:#1b2029; --line:#262c38; --line2:#3a4250;
    --ink:#e9edf4; --muted:#8e98a9;
    --accent:#4fd3dd; --accent-ink:#04232a; --good:#4fd3dd; --warn:#ffc46b; --bad:#ff8b8b; }
  * { box-sizing: border-box; }
  body { width: 320px; margin: 0; padding: 14px; background: var(--bg); color: var(--ink);
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }

  h1 { margin: 0; font-size: .95rem; font-weight: 700; letter-spacing: -.02em; }
  p.lead { margin: .1rem 0 10px; font-size: .78rem; color: var(--muted); }
  /* 古いものを見ていないかを最初に確かめられるように、いちばん上に出す */
  #ver { margin: 0 0 12px; font: .71rem/1.5 ui-monospace, Menlo, monospace; color: var(--muted);
         background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; }

  label { display: block; font-size: .72rem; color: var(--muted); margin-bottom: 4px; }
  input { width: 100%; padding: 8px 10px; border-radius: 6px; font: inherit;
    background: var(--surface2); color: var(--ink); border: 1px solid var(--line2); }
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }

  button { width: 100%; margin-top: 8px; padding: 9px; border: 0; border-radius: 6px;
    font: inherit; font-weight: 700; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: var(--surface2); color: var(--ink); border: 1px solid var(--line2); font-weight: 600; }
  button.ghost:hover { background: var(--line); filter: none; }

  #msg { min-height: 1.3em; margin: 8px 0 0; font-size: .76rem; color: var(--muted); }
  #msg[data-kind="ok"] { color: var(--good); }
  #msg[data-kind="bad"] { color: var(--bad); }

  /* いまどうなっているか */
  #state { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  #verdict { display: flex; gap: 7px; align-items: flex-start; font-size: .82rem; font-weight: 600; }
  #verdict .dot { width: .55rem; height: .55rem; border-radius: 50%; background: var(--muted);
                  flex: none; margin-top: .42rem; }
  #verdict[data-kind="ok"]   .dot { background: var(--good); box-shadow: 0 0 0 3px rgba(79,211,221,.18); }
  #verdict[data-kind="ok"]   #verdictText { color: var(--good); }
  #verdict[data-kind="bad"]  .dot { background: var(--bad); border-radius: 2px; }
  #verdict[data-kind="bad"]  #verdictText { color: var(--bad); }
  #verdict[data-kind="warn"] .dot { background: var(--warn); }
  #fix { margin: 6px 0 0 1.05rem; font-size: .75rem; color: var(--muted); }
  dl { margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px;
       font-size: .72rem; }
  dt { color: var(--muted); white-space: nowrap; }
  dd { margin: 0; font-family: ui-monospace, Menlo, monospace; word-break: break-all; }
  dl[hidden] { display: none; }
</style>

<h1>弾幕スライド</h1>
<p class="lead">Google スライドの発表に弾幕を重ねます</p>
<p id="ver">版を確認中…</p>

<label for="track">運営からのリンク</label>
<input id="track" placeholder="https://.../stage.html?e=…&t=…" autocomplete="off" spellcheck="false">
<button id="save">保存する</button>
<p id="msg" data-kind=""></p>

<div id="state">
  <div id="verdict" data-kind=""><span class="dot"></span><span id="verdictText">調べています…</span></div>
  <p id="fix"></p>
  <dl id="detail" hidden></dl>
  <button id="recheck" class="ghost">もう一度調べる</button>
</div>

<script src="popup.js"></script>
